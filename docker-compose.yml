services:
  finnie:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env                  # OPENAI_API_KEY and ALPHA_VANTAGE_API_KEY
    volumes:
      # Persist the Chroma index and SQLite DB across container restarts.
      # Build the index first with: docker compose run finnie python scripts/build_index.py
      - finnie_indexes:/app/data/indexes
      - finnie_db:/app/data/users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  finnie_indexes:
  finnie_db:
